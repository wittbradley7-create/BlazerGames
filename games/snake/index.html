<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1c2e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { margin-bottom: 8px; }
  #score { margin-bottom: 12px; font-size: 1.2rem; color: #9ad; }
  canvas { background: #16243b; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,.5); }
  #msg { margin-top: 14px; font-size: 1.1rem; height: 1.4em; }
  button { margin-top: 8px; padding: 10px 22px; font-size: 1rem; border: none; border-radius: 10px; background: #4caf50; color: #fff; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="c" width="320" height="320"></canvas>
  <div id="msg">Use arrow keys or swipe.</div>
  <button onclick="start()">Restart</button>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const G = 16, N = 20;
let snake, dir, nextDir, food, score, running, loop;
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

function start() {
  snake = [{x:10,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  placeFood();
  score = 0; running = true;
  scoreEl.textContent = 'Score: 0';
  msgEl.textContent = 'Use arrow keys or swipe.';
  clearInterval(loop);
  loop = setInterval(tick, 110);
}

function placeFood() {
  do { food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  if (!running) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) {
    running = false;
    msgEl.textContent = 'Game Over! Score: ' + score;
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++; scoreEl.textContent = 'Score: ' + score; placeFood();
  } else snake.pop();
  draw();
}

function draw() {
  ctx.fillStyle = '#16243b';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = '#ff5252';
  ctx.fillRect(food.x*G, food.y*G, G-2, G-2);
  snake.forEach((s,i) => {
    ctx.fillStyle = i === 0 ? '#69f0ae' : '#4caf50';
    ctx.fillRect(s.x*G, s.y*G, G-2, G-2);
  });
}

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowUp' && dir.y === 0) nextDir = {x:0,y:-1};
  else if (k === 'ArrowDown' && dir.y === 0) nextDir = {x:0,y:1};
  else if (k === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1,y:0};
  else if (k === 'ArrowRight' && dir.x === 0) nextDir = {x:1,y:0};
});

// swipe
let tx, ty;
c.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
c.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x === 0) nextDir = {x:1,y:0};
    else if (dx < 0 && dir.x === 0) nextDir = {x:-1,y:0};
  } else {
    if (dy > 0 && dir.y === 0) nextDir = {x:0,y:1};
    else if (dy < 0 && dir.y === 0) nextDir = {x:0,y:-1};
  }
});

start();
</script>
</body>
</html>
