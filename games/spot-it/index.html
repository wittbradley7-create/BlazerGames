<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spot It</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#03071e;color:#ffffff;font-family:'Segoe UI',system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:8px}
h1{font-size:5vw;margin-bottom:6px;color:#dc2f02;text-align:center}
#score{font-size:4vw;margin-bottom:6px;color:#ffffff}
canvas{background:#370617;border:3px solid #dc2f02;border-radius:8px;touch-action:none;max-width:96vw;max-height:70vh}
#msg{font-size:5vw;color:#dc2f02;text-align:center;min-height:1em}
button{margin-top:8px;padding:10px 22px;font-size:4vw;background:#dc2f02;color:#03071e;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<h1>Spot It</h1>
<div id="score">Pairs: 0 / 8</div><div id="grid" style="display:grid;grid-template-columns:repeat(4,70px);gap:8px"></div><div id="msg"></div><style>#grid .c{width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#370617;border:2px solid #dc2f02;border-radius:8px;cursor:pointer;color:#ffffff;user-select:none}</style>
<script>
let syms=['A','B','C','D','E','F','G','H'];
let cards=[...syms,...syms].sort(()=>Math.random()-.5),flipped=[],matched=[],lock=false,sc=0;
let grid=document.getElementById('grid');grid.innerHTML='';
cards.forEach((v,i)=>{let d=document.createElement('div');d.className='c';d.dataset.v=v;d.textContent='?';d.onclick=()=>flip(d);grid.appendChild(d)});
function flip(d){if(lock||flipped.includes(d)||matched.includes(d))return;d.textContent=d.dataset.v;d.style.background='#dc2f02';flipped.push(d);
if(flipped.length==2){lock=true;if(flipped[0].dataset.v==flipped[1].dataset.v){matched.push(...flipped);sc++;document.getElementById('score').textContent='Pairs: '+sc+' / 8';flipped=[];lock=false;if(matched.length==16)document.getElementById('msg').textContent='You Win!'}else{setTimeout(()=>{flipped.forEach(f=>{f.textContent='?';f.style.background='#370617'});flipped=[];lock=false},700)}}}
</script>
</div>
</body>
</html>
