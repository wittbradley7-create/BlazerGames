<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Soul Eater</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#231942;color:#ffffff;font-family:'Segoe UI',system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:8px}
h1{font-size:5vw;margin-bottom:6px;color:#ff7b00;text-align:center}
#score{font-size:4vw;margin-bottom:6px;color:#ffffff}
canvas{background:#5f4bb6;border:3px solid #ff7b00;border-radius:8px;touch-action:none;max-width:96vw;max-height:70vh}
#msg{font-size:5vw;color:#ff7b00;text-align:center;min-height:1em}
button{margin-top:8px;padding:10px 22px;font-size:4vw;background:#ff7b00;color:#231942;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
<h1>Soul Eater</h1>
<div id="score">Survived: 0</div><div id="face" style="font-size:90px;cursor:pointer;user-select:none">\u{1F440}</div><div id="msg" style="color:#ff7b00;font-size:5vw">Don't click while it blinks!</div><button>Restart</button>
<script>
let sc=0,eyes=true,blink=0,over=false;let face=document.getElementById('face');
function loop(){if(over)return;blink++;if(blink>60+Math.random()*120){eyes=false;blink=0;setTimeout(function(){if(!over){eyes=true;sc++;document.getElementById('score').textContent='Survived: '+sc}},300)}face.textContent=eyes?'\u{1F440}':'- -'}
function check(){if(!eyes&&!over){over=true;document.getElementById('msg').textContent='JUMPSCARE! Survived '+sc;face.textContent='\u{1F631}'}}
face.onclick=check;let tmr=setInterval(loop,200);
function start(){sc=0;eyes=true;blink=0;over=false;document.getElementById('score').textContent='Survived: 0';document.getElementById('msg').textContent='';face.textContent='\u{1F440}';clearInterval(tmr);tmr=setInterval(loop,200)}
document.querySelector('button').onclick=start;start();
</script>
</div>
</body>
</html>
