<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2a1a3e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  h1 { margin-bottom: 8px; }
  #info { margin-bottom: 14px; color: #c9b3ff; font-size: 1.1rem; }
  #board { display: grid; grid-template-columns: repeat(4, 72px); gap: 10px; }
  .card { width: 72px; height: 72px; border-radius: 10px; background: #4a3260; display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; user-select: none; transition: background .15s; }
  .card:hover { background: #5a4270; }
  .card.flip { background: #fff; color: #333; }
  .card.match { background: #69f0ae; color: #1b1b2f; cursor: default; }
  button { margin-top: 18px; padding: 10px 22px; font-size: 1rem; border: none; border-radius: 10px; background: #b388ff; color: #1b1b2f; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
  <h1>Memory Match</h1>
  <div id="info">Moves: 0 &nbsp; Matches: 0/8</div>
  <div id="board"></div>
  <button onclick="start()">New Game</button>
<script>
const board = document.getElementById('board');
const info = document.getElementById('info');
const emojis = ['🍎','🚀','🎲','🎵','🐱','🌈','⚡','⚽'];
let cards, flipped, matches, moves, lock;

function start() {
  const deck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
  cards = deck.map((e, i) => ({id: i, val: e, matched: false}));
  flipped = []; matches = 0; moves = 0; lock = false;
  info.textContent = 'Moves: 0  Matches: 0/8';
  draw();
}

function draw() {
  board.innerHTML = '';
  cards.forEach(card => {
    const d = document.createElement('div');
    d.className = 'card' + (card.matched ? ' match' : (flipped.includes(card.id) ? ' flip' : ''));
    d.textContent = (card.matched || flipped.includes(card.id)) ? card.val : '';
    d.onclick = () => flip(card.id);
    board.appendChild(d);
  });
}

function flip(id) {
  if (lock) return;
  const card = cards.find(c => c.id === id);
  if (card.matched || flipped.includes(id) || flipped.length === 2) return;
  flipped.push(id);
  draw();
  if (flipped.length === 2) {
    moves++;
    lock = true;
    const [a, b] = flipped.map(f => cards.find(c => c.id === f));
    if (a.val === b.val) {
      a.matched = true; b.matched = true; matches++;
      flipped = []; lock = false;
      info.textContent = 'Moves: ' + moves + '  Matches: ' + matches + '/8';
      if (matches === 8) info.textContent = 'You won in ' + moves + ' moves!';
      draw();
    } else {
      setTimeout(() => { flipped = []; lock = false; info.textContent = 'Moves: ' + moves + '  Matches: ' + matches + '/8'; draw(); }, 700);
    }
  }
}

start();
</script>
</body>
</html>
