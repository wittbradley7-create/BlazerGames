<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1b1b1b; font-family: 'Montserrat', Arial, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .play-container { text-align: center; }
        .play-container h1 { color: #fff; font-size: 3rem; margin-bottom: 1rem; }
        .play-container p { color: #aaa; font-size: 1.2rem; margin-bottom: 2rem; }
        .play-btn { display: inline-block; background: #e2231a; color: #fff; text-decoration: none; padding: 1rem 3rem; border-radius: 8px; font-size: 1.5rem; font-weight: bold; transition: transform .2s; }
        .play-btn:hover { transform: scale(1.05); }
        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>
    <div class="play-container">
        <h1>ROBLOX</h1>
        <p>Click below to play Roblox in your browser</p>
        <a href="https://now.gg/apps/roblox-corporation/5349/roblox.html" target="_blank" class="play-btn">Play Now</a>
    </div>
</body>
</html>
